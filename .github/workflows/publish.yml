name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Discord
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          short_sha="${SHORT_SHA:0:7}"
          commit_url="https://github.com/${REPO}/commit/${SHORT_SHA}"

          webhook_url="$DISCORD_DEPLOY_WEBHOOK"
          if [[ "$webhook_url" != *"/api/v10/"* ]]; then
              webhook_url="${webhook_url/\/api\//\/api\/v10\/}"
          fi
          webhook_url="${webhook_url}?with_components=true"

          payload=$(jq -nc \
              --arg repo "$REPO" \
              --arg version "$VERSION" \
              --arg message "$first_line" \
              --arg author "$AUTHOR" \
              --arg sha "$short_sha" \
              --arg url "$commit_url" \
              '{
                  flags: 32768,
                  components: [{
                      type: 17,
                      accent_color: 5763719,
                      components: [
                          { type: 10, content: ("### Published " + $repo + " " + $version) },
                          { type: 14, divider: true, spacing: 1 },
                          { type: 10, content: ("**Commit:** [" + $message + "](" + $url + ")\n**Author:** " + $author + "\n**SHA:** `" + $sha + "`") }
                      ]
                  }]
              }')

          http_code=$(curl -s -o /tmp/discord_response.json -w '%{http_code}' -X POST "$webhook_url" \
              -H "Content-Type: application/json" \
              -d "$payload")

          echo "Discord responded with HTTP $http_code"
          cat /tmp/discord_response.json
          echo

          if [[ "$http_code" -ge 400 ]]; then
              exit 1
          fi
